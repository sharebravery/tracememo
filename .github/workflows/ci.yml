name: CI

on:
  pull_request:
  push:
    branches: [main]

# Checks the PR's actual code (pull_request, not pull_request_target).
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm type-check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Build ZIP
        run: pnpm zip

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: tracememo-extension
          path: dist-zip/*.zip
          if-no-files-found: error
